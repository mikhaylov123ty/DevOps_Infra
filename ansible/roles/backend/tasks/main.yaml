- name: Install latest version of "openjdk-16-jdk" ignoring "install-recommends"
  become: yes  
  apt:
    name:
      - "openjdk-16-jdk"
      - "python3-lxml"
    state: present
    install_recommends: no
    update_cache: yes

- name: Adding service user
  become: yes
  user:
    name: "{{ backend_user }}"
    shell: "/sbin/nologin"

- name: Create directory for backend
  become: yes
  file:
    path: "{{ artifact_dir }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: 0755

- name: Download backend jar from Nexus with maven_artifact module
  become: yes
  maven_artifact:
    dest: "{{ artifact_dir }}/{{ project_name }}.jar"
    repository_url: "{{ NEXUS_REPO_URL }}/{{ NEXUS_REPO_BACKEND_NAME }}"
    group_id: "com.yandex.practicum.devops"
    artifact_id: "{{ project_name }}"
    version: "{{ artifact_version }}"
    username: "{{ NEXUS_REPO_USER }}"
    password: "{{ NEXUS_REPO_PASS }}"

- name: Assign permissions to backend jar
  become: yes
  file:
    path: "{{ artifact_dir }}/{{ project_name }}.jar"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: 0755

- name: Building backend systemd unit file from template
  become: yes
  template:
    src: "{{ project_name }}-backend.service.j2"
    dest: "/etc/systemd/system/{{ project_name }}-backend.service"

- name: Reading new systemd configuarion
  become: yes
  systemd:
    daemon_reload: yes

- name: Done
  become: yes
  service:
    name: "{{ project_name }}-backend"
    state: started
