apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-report
  labels:
    app: backend-report
spec:
  # Стратегия развёртывания. Recreate — удалит сначала все старые Pod'ы
  # Есть и более гибкая стратегии, например, RollingUpdate, которая будет обновлять Pod'ы порциями
  strategy:
    type: Recreate
  # Желаемое количество историй деплоев
  revisionHistoryLimit: 12
  # селектор, который выбирает Pod'ы, попадающие под управление RC (Replication Controller)
  selector:
    matchLabels:
      app: backend-report
  template:
    metadata:
      labels:
        app: backend-report
    # шаблон для создания Pod'ов
    spec:
      containers:
        - image: gitlab.praktikum-services.ru:5050/std-048-04/sausage-store/sausage-backend-report:latest
          name: backend-report
          imagePullPolicy: Always
          env:
            - name: DB
              valueFrom:
                secretKeyRef:
                  name: mongodb-uri
                  key: uri
            - name: PORT
              value: '8080'
          resources:
            requests:
              cpu: "5m"
              memory: "64Mi"
            limits:
              cpu: "50m"
              memory: "512Mi"
      # чтобы Кубер мог скачивать образы из нашего GitLab Registry
      imagePullSecrets:
        - name: docker-config-secret
      affinity:
        # соответствие нод, где нет лейбла frontend
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: app
                    operator: NotIn
                    values:
                      - frontend
        # соответствие подов по лейблу и запрет размещения на ноде с одинаковым hostname лейблом
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: backend-report
                topologyKey: kubernetes.io/hostname