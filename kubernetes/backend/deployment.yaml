apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # желаемое количество реплик Pod'а
  replicas: 2
  # Стратегия развёртывания. Recreate — удалит сначала все старые Pod'ы
  # Есть и более гибкая стратегии, например, RollingUpdate, которая будет обновлять Pod'ы порциями
  strategy:
    type: Recreate
  # селектор, который выбирает Pod'ы, попадающие под управление RC (Replication Controller)
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    # шаблон для создания Pod'ов
    spec:
      containers:
      - image: gitlab.praktikum-services.ru:5050/std-048-04/sausage-store/sausage-backend:latest
        name: backend
        imagePullPolicy: Always
        env:
          - name: SPRING_CLOUD_VAULT_HOST
            valueFrom:
              secretKeyRef:
                name: vault
                key: vault_host
          - name: SPRING_CLOUD_VAULT_TOKEN
            valueFrom:
              secretKeyRef:
                name: vault
                key: vault_token
          - name: REPORT_PATH
            value: /app/reports
          - name: LOG_PATH
            value: /app/logs
        ports:
          - name: backend
            containerPort: 8080
        resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
        livenessProbe:
          # проверка живучести выполнит запрос HTTP GET
          httpGet:
            # путь к запросу в HTTP-запросе
            path: /actuator/health
            # порт, к которому должна подключиться проверка
            port: 8080
          # перед исполнением первой проверки подождать 15 секунд, пока стартанёт бэкенд
          initialDelaySeconds: 15
          # период выполнения проверки
          periodSeconds: 30
          # максимальное время выполнения проверки (по умолчанию 1 раз)
          timeoutSeconds: 2
          # сколько раз пробовать попытку, если она провалилась (по умолчанию 1 раз)
          failureThreshold: 6
      # чтобы Кубер мог скачивать образы из нашего GitLab Registry
      imagePullSecrets:
        - name: docker-config-secret