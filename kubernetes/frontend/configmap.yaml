---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log notice;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }
    
    http {
      server {
  
        listen 80;
  
        location / {
          root /app/frontend;
          index  index.html;
          try_files $uri $uri/ /index.html;
        }
      }
    }