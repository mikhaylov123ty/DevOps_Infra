---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    cert-manager.io/cluster-issuer: "http01-clusterissuer"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "std-048-04.k8s.praktikum-services.tech"
      #secretName: frontend-tls
  rules:
    - host: "std-048-04.k8s.praktikum-services.tech"
      http:
        # Для различных путей в URL можно указать различные бэкенд-сервисы
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Заранее создан сервис типа ClusterIP
                # Он выступает в качестве бэкенда нашего Ingress
                name: frontend
                port:
                  # У сервиса может быть несколько портов, указываем нужный нам
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080