---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name}}
  annotations:
    cert-manager.io/cluster-issuer: "http01-clusterissuer"
spec:
  ingressClassName: {{.Values.ingress.ingressClassName}}
  tls:
    - hosts:
        - {{ .Values.ingress.fqdn }}
  rules:
    - host: {{ .Values.ingress.fqdn }}
      http:
        paths:
  {{ toYaml .Values.ingress.paths | nindent 12 }}